<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Index</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://kit.fontawesome.com/b3ee3da0d8.js" crossorigin="anonymous"></script>
    <!-- Don't use this in production: -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        header {
            width: 100%;
            display: inline-block;
            margin: 5px;
            padding: 5px;
            align-content: center;
        }
        body {
            width: 100%;
            display: inline-block;
            margin: 5px;
            padding: 5px;
            align-content: center;
            font-size: 1.5rem;
        }

        footer {
            display: inline-block;
            margin: 5px;
            padding: 5px;
            font-size: xx-small;
        }
        .star{
            color: gold;
        }

    </style>
</head>
<header></header>
<body>
<div id="root"></div>
<script type="text/babel">
    let icon = "⭐︎";
    const Artists = (props) => {
        const artistList = props.artists.map((artist) => <li onClick={props.onClick} key={artist['name']}> {artist['name']} </li>);
        return <ul>{artistList}</ul>
    }

    const ArtistDetail = (props) => {
        return (
            <div>
                <h3>Artist Details:</h3>
                <form>
                    <label>Name: <input type="text" name="name" value={props.artist.name || ""}
                                        onChange={props.onChange}/> </label><br/>
                    <label>Album Name: <input type="text" name="albumName" value={props.artist.albumName || ""}
                                              onChange={props.onChange}/></label><br/>
                    <button onClick={props.onClick}>Reset</button>
                </form>
            </div>
        )
    }


    const App = (props) => {
        const [artists, setArtists] = React.useState(
            [
                {"name": "Taylor Swift", "albumName": "Midnights", "icon": "⭐︎"},
                {"name": "Pink Floyd", "albumName": "Dark side of the moon" },
                {"name": "Alice in chains", "albumName": "Dirt"},
                {"name": "Miles Davis", "albumName": "Porgy and Bess"},
                {"name": "Jack Williams", "albumName": "Sky"},
                {"name": "Blurby Blurb", "albumName": "jdsfheh"}
            ]);
        const [currentArtist, setCurrentArtist] = React.useState({});

        const selectArtist = (e) => {
            const found = artists.find((artist) => {
                return artist.name === e.target.innerText;
            });
            setCurrentArtist(found);
        }

        const albumNameChange = (e) => {
            let newChange = { ...currentArtist } ;
            newChange[e.target.name] = e.target.value;

            setCurrentArtist(newChange);

            artists.find((artist, index) => {
                if (artist.name === newChange.name) {
                    artists[index] = newChange;
                    setArtists(artists);
                }
            })
        }

        const handleReset = () => {
            Array.from(document.querySelectorAll("input")).forEach(
                input => (input.value = "")
            );
            this.setState({
                values: [{}]
            });
        };

        return (
            <div>
                <h3>Albums</h3>
                <Artists artists={artists} onClick={selectArtist}/>
                <ArtistDetail artist={currentArtist} onChange={albumNameChange} />
            </div>
        );

    }
    const container = document.getElementById("root");
    const root = ReactDOM.createRoot(container);
    root.render(<App name='Artists'/>);
</script>

</body>
</html>
